<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSC - GPA Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">UCSC</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-button home-btn">
                        <span class="btn-icon">🏠</span>
                        <span class="btn-text">Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="idea-board.html" target="_blank" class="nav-button ideas-btn">
                        <span class="btn-icon">💡</span>
                        <span class="btn-text">Group Idea Flow</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="pomodoro.html" target="_blank" class="nav-button pomodoro-btn">
                        <span class="btn-icon">⏱️</span>
                        <span class="btn-text">Pomodoro Timer</span>
                    </a>
                </li>
                <li class="nav-item">
                    <button id="darkModeToggle" class="nav-button theme-toggle">
                        <span class="theme-icon">🌙</span>
                    </button>
                </li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <section class="gpa-section" id="gpa">
            <div class="container">
                <div class="section-header">
                    <h1>GPA Calculator</h1>
                    <p>Calculate your Grade Point Average with ease</p>
                </div>

                <div class="gpa-calculator">
                    <div class="calculator-inputs">
                        <h2>Add Your Courses</h2>
                        <div class="course-inputs" id="courseInputs">
                            <div class="course-row">
                                <div class="input-group">
                                    <label>Course Name</label>
                                    <input type="text" placeholder="e.g., Computer Science 101" class="course-name">
                                </div>
                                <div class="input-group">
                                    <label>Credits</label>
                                    <input type="number" min="0" max="6" step="0.5" placeholder="3" class="course-credits">
                                </div>
                                <div class="input-group">
                                    <label>Grade</label>
                                    <select class="course-grade">
                                        <option value="">Select Grade</option>
                                        <option value="4.0">A (4.0)</option>
                                        <option value="3.7">A- (3.7)</option>
                                        <option value="3.3">B+ (3.3)</option>
                                        <option value="3.0">B (3.0)</option>
                                        <option value="2.7">B- (2.7)</option>
                                        <option value="2.3">C+ (2.3)</option>
                                        <option value="2.0">C (2.0)</option>
                                        <option value="1.7">C- (1.7)</option>
                                        <option value="1.3">D+ (1.3)</option>
                                        <option value="1.0">D (1.0)</option>
                                        <option value="0.0">F (0.0)</option>
                                    </select>
                                </div>
                                <button class="remove-course" onclick="removeCourse(this)">×</button>
                            </div>
                        </div>
                        <div class="calculator-actions">
                            <button class="btn-primary" onclick="addCourse()">Add Course</button>
                            <button class="btn-secondary" onclick="resetCalculator()">Reset</button>
                            <button class="btn-secondary" onclick="toggleFullscreen()">📺 Fullscreen</button>
                        </div>
                    </div>

                    <div class="calculator-results">
                        <h2>Your GPA Results</h2>
                        <div class="gpa-display-container">
                            <div class="gpa-display" id="gpaDisplay">--</div>
                            <div class="gpa-bar">
                                <div class="gpa-fill" id="gpaFill"></div>
                            </div>
                        </div>
                        <div class="gpa-stats">
                            <div class="stat-item">
                                <span class="stat-label">Total Credits:</span>
                                <span class="stat-value" id="totalCredits">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Total Courses:</span>
                                <span class="stat-value" id="totalCourses">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Grade Points:</span>
                                <span class="stat-value" id="totalPoints">0.00</span>
                            </div>
                        </div>
                        <div class="gpa-message" id="gpaMessage"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 UCSC Tools. All rights reserved. | Built with ❤️</p>
    </footer>

    <script src="script.js"></script>
    <script src="gpa.js"></script>
</body>
</html>
